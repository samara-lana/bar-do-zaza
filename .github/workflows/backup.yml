name: Backup do banco

# Todo dia às 5h (fim da noite do bar) tira uma cópia do Supabase inteiro.
# O repositório é público, então a cópia sai CRIPTOGRAFADA e fica guardada
# como artefato da Action por 90 dias (aba Actions → Backup do banco → run).
#
# Segredos necessários (Settings → Secrets and variables → Actions):
#   SUPABASE_SERVICE_ROLE_KEY  chave service_role do projeto
#   BACKUP_SENHA               senha para abrir a cópia (guarde fora do GitHub)
#
# Para abrir:  openssl enc -d -aes-256-cbc -pbkdf2 -in zaza.json.enc -out zaza.json -pass pass:SENHA
on:
  schedule:
    - cron: "0 8 * * *" # 8h UTC = 5h em Brasília
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Copiar o banco
        env:
          SUPABASE_URL: https://jezxejsellwjyxunsxfn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/backup.mjs saida
      - name: Criptografar
        env:
          BACKUP_SENHA: ${{ secrets.BACKUP_SENHA }}
        run: |
          test -n "$BACKUP_SENHA" || { echo "Falta o segredo BACKUP_SENHA"; exit 1; }
          for f in saida/*.json; do
            openssl enc -aes-256-cbc -pbkdf2 -salt -in "$f" -out "$f.enc" -pass env:BACKUP_SENHA
            rm "$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: backup-zaza
          path: saida/*.enc
          retention-days: 90
